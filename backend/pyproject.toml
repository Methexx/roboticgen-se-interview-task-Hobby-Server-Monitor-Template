[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hobby-server-monitor"
version = "0.0.0"
description = "Hobby Server Monitor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "falcon==4.3.1",
  "google-auth==2.58.0",
  "gunicorn==26.2.0",
  "pylxd==2.4.2",
  "requests==2.34.2",
  "tinyflux==1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
